[project]
name = "rag-langchain"
version = "0.1.0"
description = "LangChain and FAISS RAG familiarisation project"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "faiss-cpu>=1.10.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
